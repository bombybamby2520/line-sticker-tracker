name: Line Sticker Rank Scraper

on:
  schedule:
    # รันทุกๆ 6 ชั่วโมง (นาทีที่ 0 ของชั่วโมงที่ 0, 6, 12, 18 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # ปุ่มกดรันด้วยตนเองผ่านหน้าเว็บ GitHub

# ให้สิทธิ์ Bot บันทึกและ Push ไฟล์กลับเข้า Repository
permissions:
  contents: write

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push updated data.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git commit -m "auto: update sticker ranks [$(date -u +'%Y-%m-%d %H:%M UTC')]"
        git push