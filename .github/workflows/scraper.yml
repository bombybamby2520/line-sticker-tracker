name: Line Sticker Rank Scraper

on:
  workflow_dispatch: # ปุ่มกดรันเองได้ด้วยตนเองผ่านหน้าเว็บ GitHub (ปิด schedule อัตโนมัติแล้ว ใช้ PC เป็นหลักแทน)

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Random delay before scraping
      run: sleep $((RANDOM % 300))

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push updated data.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update sticker ranks [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)