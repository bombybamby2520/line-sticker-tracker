name: Line Sticker Rank Scraper

on:
  schedule:
    # รันทุกๆ นาทีที่ 0 ของทุกชั่วโมง (เช่น 21:00, 22:00, 23:00)
    - cron: '0 */6 * * *'
  workflow_dispatch: # ปุ่มกดรันเองได้ด้วยตนเองผ่านหน้าเว็บ GitHub

jobs:
  scrape-and-commit:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4

    - name: Run Scraper
      run: python scraper.py

    - name: Commit and Push updated data.json
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data.json
        # เช็กว่า data.json มีการเปลี่ยนแปลงหรือไม่ ก่อน commit
        git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update sticker ranks [$(date -u +'%Y-%m-%d %H:%M UTC')]" && git push)